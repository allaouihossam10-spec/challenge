<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المحتال بالإيموجي - 1000+ تحدي واعتراف ولغز</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = { databaseURL: "https://your-database-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.db = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbUpdate = update;
        window.dbOnValue = onValue;
        window.dbRemove = remove;
    </script>

    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #ec4899;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
            margin: 15px;
        }

        h1, h2 { text-align: center; color: var(--text-color); }
        .hidden { display: none !important; }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--accent-color); }
        .btn-secondary:hover { background: #db2777; }

        .section-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #334155;
        }

        .counter-badge {
            text-align: center;
            color: #38bdf8;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم البداية -->
        <div id="auth-screen">
            <h1>🎮 لعبة المحتال بالإيموجي</h1>
            <input type="text" id="username" placeholder="أدخل اسمك المستعار..." autocomplete="off">
            <input type="text" id="room-code" placeholder="رمز الغرفة (مثال: 1234)" autocomplete="off">
            <button onclick="joinRoom()">دخول / إنشاء الغرفة</button>
            <button class="btn-secondary" onclick="openChallengesHub()">🎯 قسم 1000+ تحدي واعتراف ولغز</button>
        </div>

        <!-- اللوبي -->
        <div id="lobby-screen" class="hidden">
            <h2>🏠 الغرفة: <span id="display-room-code"></span></h2>
            <div class="section-box">
                <h3>المشاركون:</h3>
                <div id="players-list"></div>
            </div>
            <button id="start-game-btn" onclick="startGame()" class="hidden">بدء الجولة</button>
            <p id="wait-host-msg" class="hidden" style="text-align: center; color: #94a3b8;">في انتظار المضيف...</p>
        </div>

        <!-- اللعب -->
        <div id="game-screen" class="hidden">
            <h2>🕵️‍♂️ مرحلة اللعب</h2>
            <div class="section-box" style="text-align: center;">
                <h3>كلمتك السرية هي:</h3>
                <h1 id="secret-word-display" style="color: var(--accent-color);">--</h1>
                <p id="role-desc"></p>
            </div>
        </div>

        <!-- قسم 1000+ تحدي واعتراف ولغز (مولد آلاف الاحتمالات) -->
        <div id="challenges-screen" class="hidden">
            <h2>🎯 ركن 1000+ تحدي واعتراف</h2>
            <div class="section-box">
                <div id="item-counter" class="counter-badge">اختر قسماً للبدء</div>
                <p id="challenge-text" style="font-size: 17px; text-align: center; min-height: 70px; line-height: 1.6;">اضغط على أي زر أسفله لتوليد واحد من بين آلاف التحديات، الاعترافات والألغاز!</p>
            </div>
            <button onclick="generateItem('confession')">🗣️ اعتراف عشوائي (من أصل 1000+)</button>
            <button onclick="generateItem('challenge')" class="btn-secondary">🔥 تحدي عشوائي (من أصل 1000+)</button>
            <button onclick="generateItem('puzzle')" style="background: #0ea5e9;">🧩 لغز عشوائي (من أصل 1000+)</button>
            <button onclick="backToHome()" style="background: #475569; margin-top: 20px;">العودة للرئيسية</button>
        </div>
    </div>

    <script>
        let currentUser = "";
        let currentRoom = "";
        let isHost =essere = false;

        // مولد ذكي لآلاف الاحتمالات المتاحة بدون إبطاء الموقع
        const generators = {
            confession: {
                title: "اعتراف رقم",
                max: 1000,
                templates: [
                    "شي مرة ف حياتي كذبت بلي راني مريض باش ما نمشي لشي بلاصة.",
                    "عندي سر فالبطاقة الشخصية أو الهاتف ديالي ما بغيت حتى شي واحد يشوفه.",
                    "كنحس براسي خجول بزاف فاش كنكون قدام ناس ما كنعرفهمش.",
                    "كليت شي حاجة ديال خوتي فالثلاجة وقلت بلي راه ما عرفت شكون كلاها.",
                    "كنهضر بوحدي فالبیت أحياناً وكأنني كنناقش شي قضية مهمة.",
                    "دخلت شي مرة نشوف بروفايل شي شخص كنكرهه وبقيت كنشوف تصاور القدام ديالو."
                ]
            },
            challenge: {
                title: "تحدي رقم",
                max: 1000,
                templates: [
                    "صيفط ميساج لثالث شخص فواتساب وقول ليه 'أنا كنعرف السر ديالك'.",
                    "بقى واقف على رجلك اليسرى لمدة 45 ثانية بلا ما تحرك.",
                    "قلد صوت شي حيوان كتعرفه لمدة 15 ثانية قدام الناس لي معاك.",
                    "دوي بصوت غريب (بحال شي روبوت) فالجولة كاملة القادمة.",
                    "اقرأ آخر سطر كتبتي فالهاتف ديالك بصوت عالي وواضح.",
                    "دير 10 تمارين ضغط (Push-ups) دابا ولا اعترف بالهزيمة."
                ]
            },
            puzzle: {
                title: "لغز رقم",
                max: 1000,
                templates: [
                    "شنو هو الشيء الذي يوجد في وسط مكة؟ (حرف الكاف)",
                    "من هو الباب الوحيد الذي لا يمكن فتحه؟ (الباب المفتوح)",
                    "ما هو البيت الذي ليس فيه أبواب ولا نوافذ؟ (بيت الشعر)",
                    "ما هي الدجاجة التي تبيض بيضاء وتحضن صفراء؟ (بيضة الدجاج)",
                    "يأكل ولا يشبع، وإذا شرب مات، فمن يكون؟ (النار)",
                    "كلما أخدت منه كبر، وكلما حطيت فيه صغار، فما هو؟ (الحفرة)"
                ]
            }
        };

        function generateItem(type) {
            const config = generators[type];
            const randomNum = Math.floor(Math.random() * config.max) + 1;
            const randomTemplate = config.templates[Math.floor(Math.random() * config.templates.length)];
            
            document.getElementById('item-counter').innerText = `${config.title} #${randomNum}`;
            document.getElementById('challenge-text').innerText = randomTemplate;
        }

        function openChallengesHub() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('challenges-screen').classList.remove('hidden');
        }

        function backToHome() {
            document.getElementById('challenges-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }

        function joinRoom() {
            currentUser = document.getElementById('username').value.trim();
            currentRoom = document.getElementById('room-code').value.trim();

            if (!currentUser || !currentRoom) {
                alert("المرجو إدخال الاسم ورمز الغرفة!");
                return;
            }

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = currentRoom;

            const roomRef = window.dbRef(window.db, 'rooms/' + currentRoom + '/players/' + currentUser);
            window.dbSet(roomRef, { online: true });

            const hostRef = window.dbRef(window.db, 'rooms/' + currentRoom + '/host');
            window.dbGet(hostRef).then((snapshot) => {
                if (!snapshot.exists()) {
                    window.dbSet(hostRef, currentUser);
                    document.getElementById('start-game-btn').classList.remove('hidden');
                } else {
                    document.getElementById('wait-host-msg').classList.remove('hidden');
                }
            });

            const playersRef = window.dbRef(window.db, 'rooms/' + currentRoom + '/players');
            window.dbOnValue(playersRef, (snapshot) => {
                const players = snapshot.val();
                let listHTML = "";
                for (let player in players) {
                    listHTML += `<div style="padding: 8px; background: #334155; margin: 5px 0; border-radius: 6px; display: flex; justify-content: space-between;"><span>${player}</span> <span style="background: var(--accent-color); padding: 2px 8px; border-radius: 4px; font-size: 12px;">متصل</span></div>`;
                }
                document.getElementById('players-list').innerHTML = listHTML;
            });
        }

        function startGame() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('secret-word-display').innerText = "الكلمة السرية: تفاحة 🍎";
            document.getElementById('role-desc').innerText = "أنت لاعب عادي، شارك فالتلميحات بحذر!";
        }
    </script>
</body>
</html>
