<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي العباقرة والأقوال - لخص خصومك</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); width: 100%; max-width: 550px; text-align: center; border: 1px solid #334155; }
        input, button { width: 100%; padding: 14px; margin: 12px 0; border-radius: 10px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #334155; color: white; text-align: center; outline: none; }
        input:focus { border: 2px solid #3b82f6; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }
        .option-btn { background: #334155; margin: 8px 0; text-align: right; padding: 12px 18px; color: #e2e8f0; border-radius: 8px; border: 1px solid #475569; }
        .option-btn:hover { background: #475569; border-color: #3b82f6; }
        .hidden { display: none; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; text-align: center; }
        th { background: #334155; color: #60a5fa; }
        .badge { background: #f59e0b; color: #000; padding: 3px 8px; border-radius: 6px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <!-- شاشة التسجيل -->
    <div id="login-screen">
        <h2>🔥 تحدي العباقرة والأقوال المعقدة</h2>
        <p style="color: #94a3b8; font-size: 14px;">اختبر ذكاءك في المنطق، الفلسفة، وكشف الخداع، وتحدّ أصدقاءك!</p>
        <input type="text" id="username" placeholder="اكتب اسمك المستعار هنا...">
        <button onclick="startQuiz()">ابدأ التحدي الآن</button>
    </div>

    <!-- شاشة الأسئلة -->
    <div id="quiz-screen" class="hidden">
        <p id="question-progress" style="color: #60a5fa; font-weight: bold;"></p>
        <h3 id="question-text" style="line-height: 1.6;">السؤال هنا</h3>
        <div id="options-container"></div>
    </div>

    <!-- شاشة النتيجة والترتيب -->
    <div id="result-screen" class="hidden">
        <h2>🏆 انتهى التحدي بنجاح!</h2>
        <p id="final-score-text" style="font-size: 18px; margin: 15px 0;"></p>
        <h3 style="margin-top: 25px;">لوحة صدارة الأصدقاء (Leaderboard):</h3>
        <table>
            <thead>
                <tr>
                    <th>الترتيب</th>
                    <th>الاسم</th>
                    <th>النقطة</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        <button onclick="location.reload()" style="background: #10b981; margin-top: 20px;">إعادة المحاولة</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "قيل فلسفياً: 'الذكي الحقيقي هو من يدرك كم هو جاهل'. ما هو التفسير الأعمق لهذا القول؟",
            options: ["الجهل يريح العقل من التفكير", "الاعتراف بمحدودية المعرفة هو الدافع الحقيقي للتعلم والتقدم", "الغباء يوفر سعادة مطلقة", "العلماء الحقيقيون يعانون من العزلة"],
            answer: 1
        },
        {
            q: "سؤال في الكذوب والمنطق: شخص أخبرك بجملة واحدة وهي: 'جميع ما أقوله لك الآن هو كذب صريح'، فهل ما قاله يعتبر:",
            options: ["حقيقة مطلقة حدثت بالفعل", "تناقض منطقي مستحيل (مفارقة / Paradox)", "كذب لا علاقة له بالواقع", "معلومة عادية صحيحة"],
            answer: 1
        },
        {
            q: "في مواجهة شعور مفاجئ بالغربة عن العالم وكأن كل شيء حولك مزيف (على طريقة الأدب الوجودي وكافكا)، كيف يتعامل العقل العالي مع هذا الإحساس؟",
            options: ["الاستسلام المطلق والتوقف عن التفكير", "تحليله كحالة شعورية وفهم أبعاد الحرية والعبث", "الهروب في النوم والنسيان", "إنكار الواقع كلياً"],
            answer: 1
        },
        {
            q: "لغز ذكاء وتحليل: شيء تملكه أنت ويستخدمه الآخرون بكثرة أكثر مني ومنك، ومع ذلك لا تكاد تستخدمه أنت أبداً، فما هو؟",
            options: ["اسمك", "عقلك", "سيارتك", "هاتفك"],
            answer: 0
        },
        {
            q: "إذا كان القط يقطع مسافة معينة في زمن محدد، وكان الخداع البصري يجعلك ترى السرعة مضاعفة، فأي استنتاج يدير العقل نحو الحقيقة؟",
            options: ["الاعتماد على الحواس وحدها دون تفكير", "إخضاع المدخلات الحسية للمنطق والتحليل الرياضي", "تصديق ما تراه العين فوراً", "تجاهل المشكلة برمتها"],
            answer: 1
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let playerName = "";

    function startQuiz() {
        const nameInput = document.getElementById("username").value.trim();
        playerName = nameInput !== "" ? nameInput : "مجهول";
        
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("quiz-screen").classList.remove("hidden");
        showQuestion();
    }

    function showQuestion() {
        if(currentQuestion >= questions.length) {
            showResult();
            return;
        }
        let q = questions[currentQuestion];
        document.getElementById("question-progress").innerText = `السؤال ${currentQuestion + 1} من ${questions.length}`;
        document.getElementById("question-text").innerText = q.q;
        
        let optHtml = "";
        q.options.forEach((opt, index) => {
            optHtml += `<button class="option-btn" onclick="selectAnswer(${index})">${opt}</button>`;
        });
        document.getElementById("options-container").innerHTML = optHtml;
    }

    function selectAnswer(selectedIndex) {
        if(selectedIndex === questions[currentQuestion].answer) {
            score += 20; 
        }
        currentQuestion++;
        showQuestion();
    }

    function showResult() {
        document.getElementById("quiz-screen").classList.add("hidden");
        document.getElementById("result-screen").classList.remove("hidden");
        document.getElementById("final-score-text").innerHTML = `مرحباً <span class="badge">${playerName}</span>، نتيجتك هي: <b>${score} / 100</b>`;

        let leaderboard = JSON.parse(localStorage.getItem("quiz_leaderboard") || "[]");
        leaderboard.push({name: playerName, score: score});
        leaderboard.sort((a, b) => b.score - a.score);
        localStorage.setItem("quiz_leaderboard", JSON.stringify(leaderboard));

        let lbHtml = "";
        leaderboard.forEach((item, index) => {
            let rankEmoji = index === 0 ? "👑" : (index === 1 ? "🥈" : (index === 2 ? "🥉" : `#${index + 1}`));
            lbHtml += `<tr><td>${rankEmoji}</td><td>${item.name}</td><td><b>${item.score}</b></td></tr>`;
        });
        document.getElementById("leaderboard-body").innerHTML = lbHtml;
    }
</script>

</body>
</html>
